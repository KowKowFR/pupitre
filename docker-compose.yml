name: pupitre

x-app-image: &app-image
  image: pupitre:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp}
      POSTGRES_DB: ${POSTGRES_DB:-tp}
    ports:
      # Loopback uniquement : ouvre le dev local (`pnpm dev`) sans exposer la base.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tp} -d ${POSTGRES_DB:-tp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  panel:
    <<: *app-image
    command: ["web"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD:-tp}@postgres:5432/${POSTGRES_DB:-tp}
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Garde SSRF de la supervision de sites : plages internes que les sondes
      # ont le droit d'atteindre. Vide = adresses publiques uniquement.
      # Le panel la lit pour refuser une cible à la création, le worker pour la
      # refuser à chaque saut de redirection — les deux doivent avoir la même.
      MONITOR_ALLOWED_CIDRS: ${MONITOR_ALLOWED_CIDRS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app-image
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD:-tp}@postgres:5432/${POSTGRES_DB:-tp}
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker-1
      DRIVER_ROOT_PATH: ${DRIVER_ROOT_PATH:-/opt/bootstrap}
      # Restreint la plage quand la cible n'ouvre qu'une partie des ports —
      # c'est le cas du conteneur de test, qui n'en publie que dix.
      DRIVER_PORT_RANGE: ${DRIVER_PORT_RANGE:-}
      # Même valeur que côté panel : une garde qui diverge entre les deux
      # laisserait créer des sondes que le worker refuserait en silence.
      MONITOR_ALLOWED_CIDRS: ${MONITOR_ALLOWED_CIDRS:-}
      BACKUP_CONCURRENCY: ${BACKUP_CONCURRENCY:-1}
      BACKUP_TMP_DIR: ${BACKUP_TMP_DIR:-/tmp}
    volumes:
      # Clés SSH de l'hôte, en lecture seule — utilisées pour joindre les cibles.
      - ${SSH_KEYS_PATH:-${HOME}/.ssh}:/home/nodejs/.ssh:ro
      # Destination de sauvegarde « Dossier monté » : le panel y écrit en
      # `/backups`. Sans BACKUP_LOCAL_PATH, c'est un volume nommé — sur la même
      # machine que le panel, donc pas une vraie sauvegarde : S3 ou SFTP pour ça.
      - ${BACKUP_LOCAL_PATH:-backups}:/backups
    # Le worker est le **seul** service à cheval sur les deux réseaux : lui seul
    # pilote le navigateur de capture, en CDP. `capture` ne porte aucune route
    # vers `postgres`, `redis` ni `panel` — c'est précisément ce qui isole le
    # navigateur, et la raison pour laquelle cette ligne est ici et nulle part
    # ailleurs. Voir le service `capture-browser` en bas de fichier.
    networks:
      - default
      - capture
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Garantit que les migrations du panel sont passées avant le premier job.
      panel:
        condition: service_healthy

  # ── Cible SSH de test, hors du démarrage normal ──────────────────────────────
  # Démarrage explicite :
  #   docker compose --profile test up -d --build ssh-target
  # Utilisée par ./scripts/verify-targets-preflight.sh, jamais par `docker compose up`.
  ssh-target:
    profiles: ["test"]
    build:
      context: ./scripts/test-target
      args:
        AUTHORIZED_KEY: ${TEST_TARGET_PUBLIC_KEY:-}
    # docker-in-docker : la cible a son propre daemon, comme une vraie machine.
    privileged: true
    ports:
      - "127.0.0.1:${TEST_TARGET_PORT:-2222}:22"
      # Plage publiée pour joindre depuis le poste les apps déployées sur la
      # cible. Le driver reçoit la même plage via `portRange`.
      - "127.0.0.1:30000-30009:30000-30009"
    volumes:
      - dind-data:/var/lib/docker
    restart: unless-stopped

  # ── Cible K3s de test, hors du démarrage normal ──────────────────────────────
  # Démarrage explicite — il n'y a pas d'équivalent de `setup-test-target.sh`
  # pour cette cible, la procédure est manuelle et tient en deux commandes :
  #
  #   TEST_TARGET_PUBLIC_KEY="$(cat .test-target-key.pub)" \
  #     docker compose --profile test up -d --build k3s-target
  #   docker compose logs -f k3s-target   # jusqu'à « démarrage de sshd »
  #
  # La clé est celle que `setup-test-target.sh` a produite : les deux cibles de
  # test partagent la même paire. Il reste ensuite à enregistrer les cibles à la
  # main — `docs/demarrage.md` donne les deux lignes à saisir et explique
  # pourquoi il en faut deux (`k3s-target:22` pour le worker, `127.0.0.1:2223`
  # pour le poste).
  #
  # Pendant de `ssh-target`, qui porte Docker : celle-ci porte un vrai cluster
  # K3s. Elle existe pour le critère de CLAUDE.md — la même AppSpec déployée sur
  # les deux runtimes — que le rendu seul ne peut pas prouver.
  k3s-target:
    profiles: ["test"]
    build:
      context: ./scripts/test-target-k3s
      args:
        AUTHORIZED_KEY: ${TEST_TARGET_PUBLIC_KEY:-}
    # k3s monte des cgroups et pilote netfilter : il lui faut les mêmes
    # privilèges qu'au daemon Docker de l'autre cible.
    privileged: true
    # Espace de noms cgroup privé — sans quoi kubelet échoue au démarrage sur
    # « cannot enter cgroupv2 /sys/fs/cgroup/kubepods with domain controllers ».
    # En cgroup v2, un conteneur qui partage la racine de l'hôte ne peut pas y
    # créer de sous-groupe : les contrôleurs y sont en mode « domaine ». C'est
    # la même correction que k3d applique.
    cgroup: private
    tmpfs:
      - /run
      - /var/run
    ports:
      - "127.0.0.1:${K3S_TARGET_PORT:-2223}:22"
      # 80 pour l'Ingress : en K3s le panel n'alloue aucun port, l'exposition
      # passe par le contrôleur d'ingress. C'est par là qu'on joint une
      # application déployée.
      - "127.0.0.1:${K3S_TARGET_HTTP_PORT:-8080}:80"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
    restart: unless-stopped

  # ── ACME de test, hors du démarrage normal ───────────────────────────────────
  # Pebble est le serveur ACME de test de l'équipe Let's Encrypt : il émet de
  # vrais certificats, signés par une autorité jetable, après avoir réellement
  # validé le défi HTTP-01 sur le port 80 de la cible. C'est ce qui permet
  # d'éprouver « HTTPS automatique » sans domaine public. Son DNS est
  # `pebble-dns`, où `pnpm test:proxy` déclare les domaines de test.
  #
  #   docker compose --profile test up -d pebble pebble-dns acme-front
  pebble:
    profiles: ["test"]
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/acme/pebble-config.json", "-dnsserver", "pebble-dns:8053"]
    environment:
      # Pas d'attente artificielle entre deux validations : les tests restent courts.
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./scripts/test-acme/pebble-config.json:/acme/pebble-config.json:ro
    restart: unless-stopped

  # Le même Pebble, sous les noms de Let's Encrypt : pour un proxy qui n'accepte
  # pas d'autre autorité (BunkerWeb). Voir scripts/test-acme/Caddyfile.
  acme-front:
    profiles: ["test"]
    image: caddy:2.10-alpine
    volumes:
      - ./scripts/test-acme/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [pebble]
    restart: unless-stopped

  pebble-dns:
    profiles: ["test"]
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    # Rien que le DNS et son API de gestion : les défis sont relevés par les vraies cibles.
    command: ["-defaultIPv6", "", "-http01", "", "-https01", "", "-tlsalpn01", "", "-doh", ""]
    ports:
      - "127.0.0.1:8055:8055"
    restart: unless-stopped

  # ── Nginx Proxy Manager de test, hors du démarrage normal ───────────────────
  # Un proxy **distant** : hors des cibles, que Pupitre ne pilote que par son
  # API. `pnpm test:npm` le connecte, y relie les deux cibles de test et y pose
  # des domaines, certificats compris — émis par Pebble (`LE_SERVER`), dont
  # l'autorité est donnée à certbot. Ses ports sont publiés sur la boucle
  # locale : c'est par là que le panel le sonde, comme il sonderait un NPM à
  # part sur le réseau.
  #
  #   docker compose --profile test up -d pebble pebble-dns npm-proxy
  npm-proxy:
    profiles: ["test"]
    image: jc21/nginx-proxy-manager:2.16.0
    environment:
      # Le compte d'administration de cette instance jetable — `test:npm`
      # l'emploie pour créer celui de Pupitre, aux droits restreints.
      INITIAL_ADMIN_EMAIL: admin@npm.pupitre.test
      INITIAL_ADMIN_PASSWORD: ${NPM_TEST_ADMIN_PASSWORD:-npm-test-admin}
      LE_SERVER: https://pebble:14000/dir
      REQUESTS_CA_BUNDLE: /acme/pebble.minica.pem
      DISABLE_IPV6: "true"
    volumes:
      # NPM refuse de démarrer si ces deux dossiers ne sont pas des volumes.
      - npm-test-data:/data
      - npm-test-letsencrypt:/etc/letsencrypt
      - ./scripts/test-acme/pebble.minica.pem:/acme/pebble.minica.pem:ro
    ports:
      - "127.0.0.1:${NPM_TEST_ADMIN_PORT:-8181}:81"
      - "127.0.0.1:${NPM_TEST_HTTP_PORT:-8480}:80"
      - "127.0.0.1:${NPM_TEST_HTTPS_PORT:-8443}:443"
    restart: unless-stopped

  # ── Serveur SMTP jetable, hors du démarrage normal ───────────────────────────
  # Démarrage explicite :
  #   docker compose --profile test up -d mailpit
  # Utilisé par ./scripts/verify-notifications.sh pour vérifier le canal e-mail
  # contre un vrai serveur SMTP plutôt que contre un faux : Mailpit accepte la
  # session, garde le message, et l'expose sur une API HTTP — ce qui permet de
  # relire le sujet, la partie texte et la partie HTTP réellement émises.
  # Il n'envoie rien vers l'extérieur : tout ce qui entre reste dans sa mémoire.
  # Jamais démarré par `docker compose up`.
  mailpit:
    profiles: ["test"]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"

  # ── Navigateur de capture, hors du démarrage normal ──────────────────────────
  # Démarrage explicite :
  #   docker compose --profile capture up -d capture-browser
  #   # puis, dans .env :  MONITOR_CAPTURE_CDP_URL=http://capture-browser:9222
  #
  # Ce qu'il fait : rendre la page d'un site supervisé au moment où un incident
  # s'ouvre ou se referme, pour qu'on voie ce que la sonde a vu. « Code 503 » ne
  # dit pas si la page était blanche, en maintenance ou défigurée ; une image le
  # dit. Un site qui rend 200 avec un tunnel de paiement cassé est au vert pour
  # la sonde et en panne pour ses visiteurs — c'est le cas que seule une image
  # attrape.
  #
  # ── Pourquoi un conteneur à part, et pas Playwright dans le worker ──────────
  #
  #  1. **Le réseau, et c'est la vraie raison.** La garde SSRF de la supervision
  #     (`packages/core/src/monitors/ssrf.ts`) est construite avec soin : on
  #     résout une fois, on contrôle *toutes* les adresses, on se connecte à
  #     l'adresse littérale — le rebinding DNS est fermé. Un navigateur passe à
  #     travers **par l'intérieur** : il suit les redirections, charge les
  #     sous-ressources, et exécute du JavaScript qui peut requêter ce qu'il
  #     veut. Une page hostile supervisée par Pupitre irait lire
  #     `http://panel:3000/api/...` ou taper `postgres:5432`.
  #
  #     Une garde applicative *dans* le navigateur (interception de requêtes)
  #     serait contournable et surtout oubliable. La réponse est donc
  #     topologique — mais pas celle qu'on croit, et la nuance a été **mesurée**,
  #     pas supposée : deux réseaux Compose distincts ne sont *pas* isolés l'un
  #     de l'autre. Depuis un simple réseau `capture` non interne, on joint
  #     `172.21.0.4:3000` et on lit la réponse du panel. Seul le nom disparaît.
  #
  #     Ce qui isole vraiment est `internal: true` : plus de passerelle du tout,
  #     une seule ligne dans la table de routage. Mais un réseau interne coupe
  #     aussi l'Internet, et un navigateur sans Internet ne capture rien. D'où
  #     le montage final : réseau **interne**, dont la seule sortie est un
  #     mandataire tenu par le worker, qui applique à chaque requête la garde
  #     SSRF déjà écrite. Une page ne peut pas contourner le mandataire de son
  #     navigateur, et si quelqu'un retirait l'option, le navigateur ne perdrait
  #     pas sa garde : il perdrait l'Internet, bruyamment.
  #
  #  2. **Le poids.** L'image applicative est sur base Alpine, et les
  #     navigateurs de Playwright sont liés à la glibc : il n'y en a pas pour
  #     musl. Le conteneur séparé règle la question sans toucher à l'image du
  #     worker, qui ne prend pas un octet.
  #
  # ── Pourquoi cette image-là ─────────────────────────────────────────────────
  # `headless-shell` est le binaire Chromium réduit au strict nécessaire pour
  # être piloté : 146 Mo au lieu de 2 Go pour une image Playwright complète, pas
  # d'interface, pas de codecs propriétaires. Il expose directement CDP, donc le
  # worker le pilote avec `fetch` et `WebSocket` — tous deux natifs sous Node 24,
  # aucune dépendance npm ajoutée nulle part.
  #
  # **La version est épinglée au build de Chromium près**, et ce n'est pas une
  # précaution de principe : un navigateur qui change tout seul change les
  # captures, et une comparaison avant/après entre deux moteurs différents
  # compare le moteur, pas le site.
  capture-browser:
    profiles: ["capture"]
    image: chromedp/headless-shell:151.0.7922.109
    restart: unless-stopped
    # Le seul réseau, et il ne mène nulle part : ni base, ni cache, ni panel.
    networks:
      - capture
    # Aucun port publié : le worker le joint par le réseau interne. Publier CDP
    # sur l'hôte donnerait à quiconque sur la machine un navigateur à piloter.
    # Rien qu'un `Page.navigate` vers `file:///etc/passwd` en ferait une lecture
    # de fichiers arbitraire.
    init: true
    read_only: true
    # `HOME` pointe dans le tmpfs : sans lui, fontconfig cherche son cache dans
    # `/root`, que `read_only` interdit, et rescanne toutes les polices à chaque
    # page. Ça ne casse rien, ça ralentit tout.
    environment:
      HOME: /tmp
    tmpfs:
      # Le profil est en mémoire et meurt avec le conteneur : aucun cookie,
      # aucun cache, aucune capture ne survit sur disque.
      - /tmp
      - /var/cache/fontconfig
    # Chromium alloue ses tampons de rendu dans /dev/shm ; les 64 Mo par défaut
    # de Docker font échouer le rendu des pages un peu lourdes.
    shm_size: "512m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bornes contre la page hostile : une page qui part en boucle ne doit pas
    # emporter la machine. Pas une garde de sécurité — une garde de voisinage.
    mem_limit: 1g
    pids_limit: 512
    command:
      # Le bac à sable de Chromium demande CAP_SYS_ADMIN dans un conteneur.
      # L'arbitrage est assumé : un `--cap-add=SYS_ADMIN` transformerait une
      # évasion de moteur de rendu en évasion potentielle de conteneur, alors
      # qu'ici l'évasion ne donne qu'un conteneur sans capacité, sans secret,
      # sans disque et sans route vers la pile. `run.sh` de l'image pose déjà
      # `--no-sandbox` ; c'est le réseau qui tient lieu de bac à sable.
      # **La seule porte de sortie.** Le réseau est interne : sans mandataire,
      # ce navigateur ne joint rien. Toute requête qu'il émet — page, redirection,
      # sous-ressource, `fetch()` du JavaScript de la page — passe par le worker,
      # qui lui applique la garde SSRF. Le port suit `MONITOR_CAPTURE_EGRESS_PORT`
      # — la même variable des deux côtés, pour qu'ils ne puissent pas diverger.
      - --proxy-server=http://worker:${MONITOR_CAPTURE_EGRESS_PORT:-8383}
      - --user-data-dir=/tmp/profile
      - --hide-scrollbars
      # Rien ne doit téléphoner à la maison : ni variations, ni mises à jour de
      # composants, ni synchronisation, ni remontée de plantage.
      - --disable-background-networking
      - --disable-component-update
      - --disable-sync
      - --disable-breakpad
      - --disable-domain-reliability
      - --metrics-recording-only
      - --no-first-run
      - --no-default-browser-check
      - --disable-default-apps
      - --disable-extensions
      # Une page supervisée n'ouvre ni fenêtre, ni onglet, et ne demande ni la
      # géolocalisation ni les notifications : tout est refusé sans question.
      - --block-new-web-contents
      - --deny-permission-prompts
      - --disable-features=Translate,MediaRouter,OptimizationHints,AcceptCHFrame,InterestFeedContentSuggestions
    healthcheck:
      # L'image n'a ni curl ni wget ; bash et son /dev/tcp suffisent. `CMD` et
      # non `CMD-SHELL` : le shell par défaut est dash, qui n'a pas /dev/tcp.
      #
      # L'en-tête `Host` n'est pas décoratif : le point d'entrée DevTools ferme
      # sans répondre toute requête dont le `Host` n'est ni une IP ni
      # `localhost` — sa protection contre le rebinding DNS. Sans elle, la sonde
      # lit une réponse vide et le conteneur reste éternellement « unhealthy »
      # alors que le navigateur va très bien.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 15 <&3 | grep -q 200"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  # Le réseau par défaut, celui de toute la pile. Déclaré explicitement parce
  # qu'un service qui liste ses réseaux ne l'obtient plus implicitement.
  default:
  # Le réseau de capture. Deux membres, et deux seulement : le worker, qui
  # pilote, et le navigateur, qui rend.
  #
  # **`internal: true`, et ce n'est pas de la ceinture-bretelles.** L'hypothèse
  # de départ — « deux réseaux Compose distincts sont isolés l'un de l'autre » —
  # a été mesurée sur cette machine (Docker Engine 29 / Docker Desktop) et elle
  # est **fausse** : depuis un réseau `capture` ordinaire, un conteneur joint
  # `postgres`, `redis` et `panel` par leur adresse IP et lit leurs réponses.
  # Le réseau séparé fait disparaître les *noms*, rien de plus, et deviner
  # `172.21.0.x` n'est pas un obstacle.
  #
  # Un réseau interne, lui, n'a pas de passerelle. La table de routage du
  # conteneur tient en une ligne — son propre /16 — et absolument rien d'autre
  # n'est routable : ni la pile, ni l'hôte, ni l'Internet. C'est la garantie
  # qu'on cherchait, et elle se vérifie en une commande :
  #
  #   docker compose exec capture-browser ip route     # une seule ligne
  #
  # Reste que le navigateur doit atteindre les sites supervisés. Sa seule sortie
  # est le mandataire du worker (`--proxy-server` ci-dessus), qui applique la
  # garde SSRF du projet à chaque requête. Retirer le mandataire ne rendrait pas
  # le navigateur dangereux : ça le rendrait aveugle, tout de suite.
  capture:
    internal: true

volumes:
  # `pgdata` et `redisdata` portent l'état du plan de contrôle et ont été
  # recopiés depuis les volumes préfixés `bootstrap-tp-v2_` au moment du
  # renommage. `backups` sert la destination « Dossier monté » quand
  # BACKUP_LOCAL_PATH n'est pas fourni. Les deux derniers sont des caches de
  # cibles de test — images Docker et état k3s — que Compose recrée vides et qui
  # se remplissent seuls.
  pgdata:
  redisdata:
  backups:
  k3s-data:
  dind-data:
  # L'état du Nginx Proxy Manager de test : sa base et ses certificats.
  npm-test-data:
  npm-test-letsencrypt:
