name: pupitre

x-app-image: &app-image
  image: pupitre:latest
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tp}
      POSTGRES_DB: ${POSTGRES_DB:-tp}
    ports:
      # Loopback only: opens local dev (`pnpm dev`) without exposing the database.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tp} -d ${POSTGRES_DB:-tp}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  panel:
    <<: *app-image
    command: ["web"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD:-tp}@postgres:5432/${POSTGRES_DB:-tp}
      REDIS_URL: redis://redis:6379
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # SSRF guard of site supervision: internal ranges the probes are allowed
      # to reach. Empty = public addresses only. The panel reads it to refuse a
      # target at creation, the worker to refuse it at each redirect hop — both
      # must have the same.
      MONITOR_ALLOWED_CIDRS: ${MONITOR_ALLOWED_CIDRS:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *app-image
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tp}:${POSTGRES_PASSWORD:-tp}@postgres:5432/${POSTGRES_DB:-tp}
      REDIS_URL: redis://redis:6379
      WORKER_ID: worker-1
      DRIVER_ROOT_PATH: ${DRIVER_ROOT_PATH:-/opt/bootstrap}
      # Restricts the range when the target only opens part of the ports — it is
      # the case of the test container, which only publishes ten.
      DRIVER_PORT_RANGE: ${DRIVER_PORT_RANGE:-}
      # Same value as on the panel side: a guard that diverges between the two
      # would let probes be created that the worker would silently refuse.
      MONITOR_ALLOWED_CIDRS: ${MONITOR_ALLOWED_CIDRS:-}
      BACKUP_CONCURRENCY: ${BACKUP_CONCURRENCY:-1}
      BACKUP_TMP_DIR: ${BACKUP_TMP_DIR:-/tmp}
    volumes:
      # The host's SSH keys, read-only — used to reach the targets.
      - ${SSH_KEYS_PATH:-${HOME}/.ssh}:/home/nodejs/.ssh:ro
      # "Mounted folder" backup destination: the panel writes there in
      # `/backups`. Without BACKUP_LOCAL_PATH, it is a named volume — on the same
      # machine as the panel, so not a real backup: S3 or SFTP for that.
      - ${BACKUP_LOCAL_PATH:-backups}:/backups
    # The worker is the **only** service straddling both networks: it alone
    # drives the capture browser, over CDP. `capture` carries no route to
    # `postgres`, `redis` nor `panel` — it is precisely what isolates the
    # browser, and the reason why this line is here and nowhere else. See the
    # `capture-browser` service at the bottom of the file.
    networks:
      - default
      - capture
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Ensures the panel's migrations have run before the first job.
      panel:
        condition: service_healthy

  # ── SSH test target, outside the normal startup ──────────────────────────────
  # Explicit startup:
  #   docker compose --profile test up -d --build ssh-target
  # Used by ./scripts/verify-targets-preflight.sh, never by `docker compose up`.
  ssh-target:
    profiles: ["test"]
    build:
      context: ./scripts/test-target
      args:
        AUTHORIZED_KEY: ${TEST_TARGET_PUBLIC_KEY:-}
    # docker-in-docker: the target has its own daemon, like a real machine.
    privileged: true
    ports:
      - "127.0.0.1:${TEST_TARGET_PORT:-2222}:22"
      # Range published to reach from the workstation the apps deployed on the
      # target. The driver gets the same range through `portRange`.
      - "127.0.0.1:30000-30009:30000-30009"
    volumes:
      - dind-data:/var/lib/docker
    restart: unless-stopped

  # ── K3s test target, outside the normal startup ──────────────────────────────
  # Explicit startup — there is no equivalent of `setup-test-target.sh` for this
  # target, the procedure is manual and fits in two commands:
  #
  #   TEST_TARGET_PUBLIC_KEY="$(cat .test-target-key.pub)" \
  #     docker compose --profile test up -d --build k3s-target
  #   docker compose logs -f k3s-target   # until "starting sshd"
  #
  # The key is the one `setup-test-target.sh` produced: the two test targets
  # share the same pair. The targets then remain to be registered by hand —
  # `docs/getting-started.md` gives the two lines to type and explains why two
  # are needed (`k3s-target:22` for the worker, `127.0.0.1:2223` for the
  # workstation).
  #
  # The counterpart of `ssh-target`, which carries Docker: this one carries a
  # real K3s cluster. It exists for CLAUDE.md's criterion — the same AppSpec
  # deployed on both runtimes — which the rendering alone cannot prove.
  k3s-target:
    profiles: ["test"]
    build:
      context: ./scripts/test-target-k3s
      args:
        AUTHORIZED_KEY: ${TEST_TARGET_PUBLIC_KEY:-}
    # k3s mounts cgroups and drives netfilter: it needs the same privileges as
    # the other target's Docker daemon.
    privileged: true
    # Private cgroup namespace — otherwise kubelet fails at startup on "cannot
    # enter cgroupv2 /sys/fs/cgroup/kubepods with domain controllers". With
    # cgroup v2, a container that shares the host's root cannot create a
    # subgroup there: the controllers are in "domain" mode. It is the same fix
    # k3d applies.
    cgroup: private
    tmpfs:
      - /run
      - /var/run
    ports:
      - "127.0.0.1:${K3S_TARGET_PORT:-2223}:22"
      # 80 for the Ingress: on K3s the panel allocates no port, the exposure goes
      # through the ingress controller. It is through there that a deployed
      # application is reached.
      - "127.0.0.1:${K3S_TARGET_HTTP_PORT:-8080}:80"
    volumes:
      - k3s-data:/var/lib/rancher/k3s
    restart: unless-stopped

  # ── Test ACME, outside the normal startup ────────────────────────────────────
  # Pebble is the Let's Encrypt team's test ACME server: it issues real
  # certificates, signed by a throwaway authority, after really validating the
  # HTTP-01 challenge on the target's port 80. It is what allows trying out
  # "automatic HTTPS" without a public domain. Its DNS is `pebble-dns`, where
  # `pnpm test:proxy` declares the test domains.
  #
  #   docker compose --profile test up -d pebble pebble-dns acme-front
  pebble:
    profiles: ["test"]
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/acme/pebble-config.json", "-dnsserver", "pebble-dns:8053"]
    environment:
      # No artificial wait between two validations: the tests stay short.
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./scripts/test-acme/pebble-config.json:/acme/pebble-config.json:ro
    restart: unless-stopped

  # The same Pebble, under Let's Encrypt's names: for a proxy that accepts no
  # other authority (BunkerWeb). See scripts/test-acme/Caddyfile.
  acme-front:
    profiles: ["test"]
    image: caddy:2.10-alpine
    volumes:
      - ./scripts/test-acme/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [pebble]
    restart: unless-stopped

  pebble-dns:
    profiles: ["test"]
    image: ghcr.io/letsencrypt/pebble-challtestsrv:2.10.1
    # Only the DNS and its management API: the challenges are taken up by the real targets.
    command: ["-defaultIPv6", "", "-http01", "", "-https01", "", "-tlsalpn01", "", "-doh", ""]
    ports:
      - "127.0.0.1:8055:8055"
    restart: unless-stopped

  # ── Test Nginx Proxy Manager, outside the normal startup ────────────────────
  # A **remote** proxy: outside the targets, which Pupitre only drives through
  # its API. `pnpm test:npm` connects it, links the two test targets to it and
  # sets domains there, certificates included — issued by Pebble (`LE_SERVER`),
  # whose authority is given to certbot. Its ports are published on the
  # loopback: it is through there that the panel probes it, as it would probe a
  # separate NPM on the network.
  #
  #   docker compose --profile test up -d pebble pebble-dns npm-proxy
  npm-proxy:
    profiles: ["test"]
    image: jc21/nginx-proxy-manager:2.16.0
    environment:
      # The administration account of this throwaway instance — `test:npm` uses
      # it to create Pupitre's, with restricted rights.
      INITIAL_ADMIN_EMAIL: admin@npm.pupitre.test
      INITIAL_ADMIN_PASSWORD: ${NPM_TEST_ADMIN_PASSWORD:-npm-test-admin}
      LE_SERVER: https://pebble:14000/dir
      REQUESTS_CA_BUNDLE: /acme/pebble.minica.pem
      DISABLE_IPV6: "true"
    volumes:
      # NPM refuses to start if these two folders are not volumes.
      - npm-test-data:/data
      - npm-test-letsencrypt:/etc/letsencrypt
      - ./scripts/test-acme/pebble.minica.pem:/acme/pebble.minica.pem:ro
    ports:
      - "127.0.0.1:${NPM_TEST_ADMIN_PORT:-8181}:81"
      - "127.0.0.1:${NPM_TEST_HTTP_PORT:-8480}:80"
      - "127.0.0.1:${NPM_TEST_HTTPS_PORT:-8443}:443"
    restart: unless-stopped

  # ── Throwaway SMTP server, outside the normal startup ────────────────────────
  # Explicit startup:
  #   docker compose --profile test up -d mailpit
  # Used by ./scripts/verify-notifications.sh to check the e-mail channel
  # against a real SMTP server rather than a fake one: Mailpit accepts the
  # session, keeps the message, and exposes it on an HTTP API — which allows
  # reading back the subject, the text part and the HTML part really sent. It
  # sends nothing outside: everything that comes in stays in its memory. Never
  # started by `docker compose up`.
  mailpit:
    profiles: ["test"]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "200"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"

  # ── Test Keycloak, outside the normal startup ───────────────────────────────
  # A real OpenID Connect provider, to try out single sign-on end to end: the
  # `pupitre` realm is imported at startup
  # (`scripts/test-keycloak/pupitre-realm.json`) — a confidential client, a
  # group mapper, four test accounts. Everything in it is throwaway, client
  # secret included. The panel and the browser reach it at the same address,
  # http://localhost:8180: it is the one that becomes the tokens' issuer.
  #
  #   docker compose --profile test up -d keycloak
  keycloak:
    profiles: ["test"]
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./scripts/test-keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_HTTP_PORT:-8180}:8080"
    restart: unless-stopped

  # ── Test Gitea, outside the normal startup ──────────────────────────────────
  # A real Gitea forge (same API as Forgejo and Codeberg), to try out a second
  # code provider end to end: an account, a token, a repository with its
  # pupitre.json — everything is made by `scripts/test-gitea/setup.sh` and
  # throwaway. The panel, the worker and the browser reach it at the same
  # address, http://localhost:3030: it is the one of its links.
  #
  #   docker compose --profile test up -d gitea
  gitea:
    profiles: ["test"]
    image: gitea/gitea:1.24
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:${GITEA_HTTP_PORT:-3030}/
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__repository__DEFAULT_BRANCH: main
    volumes:
      - gitea-test-data:/data
    ports:
      - "127.0.0.1:${GITEA_HTTP_PORT:-3030}:3000"
    restart: unless-stopped

  # ── Test GitLab, outside the normal startup ──────────────────────────────────
  # A real GitLab CE instance, to try out the third code provider end to end: a
  # group and a subgroup, a project with its pupitre.json, a project token —
  # everything is made by `scripts/test-gitlab/setup.sh` and throwaway. Tuned
  # for a small machine (about 3 GB of memory); it needs several minutes to
  # start. The panel, the worker and the browser reach it at the same address,
  # http://localhost:3040: it is the one of its links.
  #
  #   docker compose --profile test up -d gitlab
  gitlab:
    profiles: ["test"]
    image: gitlab/gitlab-ce:19.4.1-ce.0
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: Pupitre-forge-de-test-2026
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:${GITLAB_HTTP_PORT:-3040}'
        nginx['listen_port'] = 80
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
        gitlab_kas['enable'] = false
        registry['enable'] = false
        gitlab_pages['enable'] = false
        gitlab_rails['usage_ping_enabled'] = false
        gitlab_rails['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }
        gitaly['env'] = { 'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000' }
    volumes:
      - gitlab-test-config:/etc/gitlab
      - gitlab-test-data:/var/opt/gitlab
    ports:
      - "127.0.0.1:${GITLAB_HTTP_PORT:-3040}:80"
    restart: unless-stopped

  # ── Capture browser, outside the normal startup ──────────────────────────────
  # Explicit startup:
  #   docker compose --profile capture up -d capture-browser
  #   # then, in .env:  MONITOR_CAPTURE_CDP_URL=http://capture-browser:9222
  #
  # What it does: rendering the page of a supervised site when an incident opens
  # or closes, so that one sees what the probe saw. "Code 503" does not say
  # whether the page was blank, under maintenance or defaced; an image says it.
  # A site that returns 200 with a broken checkout funnel is green for the probe
  # and down for its visitors — it is the case only an image catches.
  #
  # ── Why a separate container, and not Playwright in the worker ──────────────
  #
  #  1. **The network, and it is the real reason.** The supervision's SSRF guard
  #     (`packages/core/src/monitors/ssrf.ts`) is built with care: we resolve
  #     once, check *all* the addresses, connect to the literal address — DNS
  #     rebinding is closed. A browser goes through **from the inside**: it
  #     follows redirects, loads subresources, and runs JavaScript that can
  #     request whatever it wants. A hostile page supervised by Pupitre would go
  #     and read `http://panel:3000/api/...` or hit `postgres:5432`.
  #
  #     An application guard *inside* the browser (request interception) could
  #     be worked around and, above all, forgotten. So the answer is topological
  #     — but not the one you would think, and the nuance was **measured**, not
  #     assumed: two distinct Compose networks are *not* isolated from each
  #     other. From a plain non-internal `capture` network, one reaches
  #     `172.21.0.4:3000` and reads the panel's response. Only the name goes
  #     away.
  #
  #     What really isolates is `internal: true`: no gateway at all any more, a
  #     single line in the routing table. But an internal network also cuts the
  #     Internet, and a browser without Internet captures nothing. Hence the
  #     final setup: an **internal** network, whose only exit is a proxy held by
  #     the worker, which applies the already written SSRF guard to each
  #     request. A page cannot get around its browser's proxy, and if someone
  #     removed the option, the browser would not lose its guard: it would lose
  #     the Internet, loudly.
  #
  #  2. **The weight.** The application image is Alpine-based, and Playwright's
  #     browsers are linked to glibc: there are none for musl. The separate
  #     container settles the question without touching the worker's image,
  #     which does not gain a byte.
  #
  # ── Why this image ──────────────────────────────────────────────────────────
  # `headless-shell` is the Chromium binary reduced to the bare minimum needed
  # to be driven: 146 MB instead of 2 GB for a complete Playwright image, no
  # interface, no proprietary codecs. It exposes CDP directly, so the worker
  # drives it with `fetch` and `WebSocket` — both native under Node 24, no npm
  # dependency added anywhere.
  #
  # **The version is pinned down to the Chromium build**, and it is not a
  # precaution of principle: a browser that changes on its own changes the
  # captures, and a before/after comparison between two different engines
  # compares the engine, not the site.
  capture-browser:
    profiles: ["capture"]
    image: chromedp/headless-shell:151.0.7922.109
    restart: unless-stopped
    # The only network, and it leads nowhere: neither database, nor cache, nor panel.
    networks:
      - capture
    # No published port: the worker reaches it through the internal network.
    # Publishing CDP on the host would give anyone on the machine a browser to
    # drive. A mere `Page.navigate` to `file:///etc/passwd` would make it an
    # arbitrary file read.
    init: true
    read_only: true
    # `HOME` points into the tmpfs: without it, fontconfig looks for its cache in
    # `/root`, which `read_only` forbids, and rescans all the fonts at each page.
    # It breaks nothing, it slows everything down.
    environment:
      HOME: /tmp
    tmpfs:
      # The profile is in memory and dies with the container: no cookie, no
      # cache, no capture survives on disk.
      - /tmp
      - /var/cache/fontconfig
    # Chromium allocates its rendering buffers in /dev/shm; Docker's default
    # 64 MB make the rendering of somewhat heavy pages fail.
    shm_size: "512m"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounds against the hostile page: a page that goes into a loop must not
    # take the machine down. Not a security guard — a neighborhood guard.
    mem_limit: 1g
    pids_limit: 512
    command:
      # Chromium's sandbox asks for CAP_SYS_ADMIN in a container. The trade-off
      # is assumed: a `--cap-add=SYS_ADMIN` would turn a rendering engine escape
      # into a potential container escape, whereas here the escape only yields a
      # container without capabilities, without secrets, without disk and
      # without a route to the stack. The image's `run.sh` already sets
      # `--no-sandbox`; it is the network that serves as the sandbox.
      # **The only way out.** The network is internal: without a proxy, this
      # browser reaches nothing. Every request it emits — page, redirect,
      # subresource, `fetch()` from the page's JavaScript — goes through the
      # worker, which applies the SSRF guard to it. The port follows
      # `MONITOR_CAPTURE_EGRESS_PORT` — the same variable on both sides, so that
      # they cannot diverge.
      - --proxy-server=http://worker:${MONITOR_CAPTURE_EGRESS_PORT:-8383}
      - --user-data-dir=/tmp/profile
      - --hide-scrollbars
      # Nothing must phone home: no variations, no component updates, no sync,
      # no crash reporting.
      - --disable-background-networking
      - --disable-component-update
      - --disable-sync
      - --disable-breakpad
      - --disable-domain-reliability
      - --metrics-recording-only
      - --no-first-run
      - --no-default-browser-check
      - --disable-default-apps
      - --disable-extensions
      # A supervised page opens neither a window nor a tab, and asks for neither
      # geolocation nor notifications: everything is refused without a question.
      - --block-new-web-contents
      - --deny-permission-prompts
      - --disable-features=Translate,MediaRouter,OptimizationHints,AcceptCHFrame,InterestFeedContentSuggestions
    healthcheck:
      # The image has neither curl nor wget; bash and its /dev/tcp are enough.
      # `CMD` and not `CMD-SHELL`: the default shell is dash, which has no
      # /dev/tcp.
      #
      # The `Host` header is not decorative: the DevTools entry point closes
      # without answering any request whose `Host` is neither an IP nor
      # `localhost` — its protection against DNS rebinding. Without it, the probe
      # reads an empty response and the container stays "unhealthy" forever
      # although the browser is perfectly fine.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -c 15 <&3 | grep -q 200"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  # The default network, the whole stack's. Declared explicitly because a
  # service that lists its networks no longer gets it implicitly.
  default:
  # The capture network. Two members, and two only: the worker, which drives,
  # and the browser, which renders.
  #
  # **`internal: true`, and it is not belt and braces.** The starting
  # assumption — "two distinct Compose networks are isolated from each other" —
  # was measured on this machine (Docker Engine 29 / Docker Desktop) and it is
  # **false**: from an ordinary `capture` network, a container reaches
  # `postgres`, `redis` and `panel` through their IP address and reads their
  # responses. The separate network makes the *names* disappear, nothing more,
  # and guessing `172.21.0.x` is no obstacle.
  #
  # An internal network, for its part, has no gateway. The container's routing
  # table fits in one line — its own /16 — and absolutely nothing else is
  # routable: neither the stack, nor the host, nor the Internet. It is the
  # guarantee we were looking for, and it can be checked in one command:
  #
  #   docker compose exec capture-browser ip route     # a single line
  #
  # Still, the browser must reach the supervised sites. Its only exit is the
  # worker's proxy (`--proxy-server` above), which applies the project's SSRF
  # guard to each request. Removing the proxy would not make the browser
  # dangerous: it would make it blind, right away.
  capture:
    internal: true

volumes:
  # `pgdata` and `redisdata` carry the control plane's state and were copied
  # from the volumes prefixed `bootstrap-tp-v2_` at the time of the renaming.
  # `backups` serves the "Mounted folder" destination when BACKUP_LOCAL_PATH is
  # not provided. The last two are test targets' caches — Docker images and k3s
  # state — that Compose recreates empty and that fill up on their own.
  pgdata:
  redisdata:
  backups:
  k3s-data:
  dind-data:
  # The test Nginx Proxy Manager's state: its database and its certificates.
  npm-test-data:
  npm-test-letsencrypt:
  # The test Gitea forge: its account, its token, its repositories.
  gitea-test-data:
  # The test GitLab instance: its configuration, its projects, its tokens.
  gitlab-test-config:
  gitlab-test-data:
