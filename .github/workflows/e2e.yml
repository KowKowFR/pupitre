name: End to end (full stack)

# ═════════════════════════════════════════════════════════════════════════════
# WHY THESE SCRIPTS ARE NOT IN `ci.yml`
#
# Measures taken on a dev workstation (M-series), to multiply by ~3 on a GitHub
# runner with 2 vCPUs:
#
#   docker build --no-cache of the panel image         84 s
#   docker compose up -d --wait (image already there)  13 s  (migrations + seed included)
#   the first 9 scripts kept, chained                 281 s
#                                                     ─────
#                                                     ~6 min here, ~12 min on a runner
#
# Against the base's ~23 s, putting this on each push would do exactly what we
# want to avoid: a CI that people stop looking at. Hence the split — the base
# at each push, this on request only.
#
# There is no nightly run any more: the repository is private, each minute is
# billed, and these scripts run locally before each PR (`.github/ci-local.md`).
#
# WHAT IS NOT HERE, AND WHY
#
# 12 of the 26 `verify-*.sh` require a privileged docker-in-docker SSH target
# (`ssh-target`) and/or a real K3s cluster (`k3s-target`):
#
#   ai, appspec-generation, deploy-logs, force-delete, ports-rollback, purge,
#   scanners, secrets, server-supervision, supervision, targets-preflight,
#   workloads
#
# These targets mount cgroups, drive netfilter and run a nested Docker daemon;
# `k3s-target` even needs a `cgroup: private` for kubelet to start. They were
# never tried out on a GitHub runner, and they really deploy applications there
# — several minutes each. Adding them here without having seen them pass would
# produce a red job at each run, that is a job nobody reads any more.
#
# `verify-export.sh` is absent from it for another reason: it requires a
# deployment already carrying logs in the database, which a new instance does
# not have. So it depends, indirectly, on the same SSH target.
#
# Four more recent scripts — `host-history`, `invitations`,
# `monitor-notifications`, `stuck-deployment` — are not classified here yet:
# they were not tried out on a runner. Adding them requires having seen them
# pass first, not declaring them green out of optimism.
#
# NO GITHUB SECRET IS NEEDED. MASTER_KEY, BETTER_AUTH_SECRET and the Postgres
# password are drawn at random by the workflow, serve for the job's duration,
# and disappear with it. The AI AppSpec generation is not exercised here: it
# would require a real provider key. Its catalog and its configuration are
# exercised offline by `pnpm test:ai`, in the base.
# ═════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Subset to run (name fragments separated by spaces,
          e.g. "roles schedules"). Empty = all.
        required: false
        default: ''

concurrency:
  group: e2e
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  BASE_URL: http://localhost:3000
  # The compose project name is fixed by the docker-compose.yml's `name:` field.
  # `verify-monitors.sh` attaches a throwaway receiver to this network.
  COMPOSE_NETWORK: pupitre_default

jobs:
  e2e:
    name: End-to-end scripts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # Same ordering constraint as in the base: `pnpm db:seed`, called by
      # verify-roles.sh, runs from `packages/db/dist`.
      - name: 'Build @pupitre/core and @pupitre/db'
        run: pnpm build:packages

      # ─────────────────────────────────────────────────────────────────────
      # Throwaway secrets. Nothing of what follows exists before this job nor after.
      # ─────────────────────────────────────────────────────────────────────
      - name: 'Throwaway .env'
        run: |
          set -euo pipefail
          motdepasse=$(openssl rand -hex 16)
          echo "::add-mask::${motdepasse}"
          cat > .env <<EOF
          POSTGRES_USER=tp
          POSTGRES_PASSWORD=${motdepasse}
          POSTGRES_DB=tp
          DATABASE_URL=postgres://tp:${motdepasse}@localhost:5433/tp
          REDIS_URL=redis://localhost:6380
          MASTER_KEY=$(openssl rand -hex 32)
          BETTER_AUTH_SECRET=$(openssl rand -base64 48)
          BETTER_AUTH_URL=${BASE_URL}
          LOG_LEVEL=info
          WEB_PORT=3000
          POSTGRES_PORT=5433
          REDIS_PORT=6380
          WORKER_CONCURRENCY=4
          DRIVER_ROOT_PATH=/opt/bootstrap
          DRIVER_PORT_RANGE=30000-30009
          MONITOR_ALLOWED_CIDRS=
          MAILPIT_SMTP_PORT=1025
          MAILPIT_HTTP_PORT=8025
          EOF
          echo ".env written ($(wc -l < .env) lines), no value logged."

      - name: Construire l'image du panel
        run: docker compose build

      # The panel applies migrations then seed at its startup
      # (docker-entrypoint.sh): `--wait` waits for its healthcheck, so waits for
      # the database to be up to date. Mailpit serves as a real SMTP server for
      # verify-notifications.sh.
      - name: Lever la stack
        id: stack
        run: |
          set -euo pipefail
          docker compose --profile test up -d --wait --wait-timeout 300 \
            postgres redis panel worker mailpit
          docker compose ps

      # ─────────────────────────────────────────────────────────────────────
      # One script = one step. The red line names the faulty script, and the
      # following ones run all the same (`!cancelled()`): a single pass gives
      # the real extent of the damage.
      # ─────────────────────────────────────────────────────────────────────
      - name: 'verify-rbac-audit.sh — RBAC and refusals log'
        id: s_rbac_audit
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'rbac-audit')) }}
        run: ./scripts/verify-rbac-audit.sh

      - name: 'verify-onboarding.sh — first administrator'
        id: s_onboarding
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'onboarding')) }}
        run: ./scripts/verify-onboarding.sh

      - name: 'verify-roles.sh — roles are data'
        id: s_roles
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'roles')) }}
        run: ./scripts/verify-roles.sh

      - name: 'verify-api-tokens.sh — jetons d’API'
        id: s_api_tokens
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'api-tokens')) }}
        run: ./scripts/verify-api-tokens.sh

      - name: 'verify-account.sh — compte et 2FA'
        id: s_account
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'account')) }}
        run: ./scripts/verify-account.sh

      - name: 'verify-2fa-reset.sh — second factor reset'
        id: s_2fa
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, '2fa')) }}
        run: ./scripts/verify-2fa-reset.sh

      - name: 'verify-settings.sh — instance settings'
        id: s_settings
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'settings')) }}
        run: ./scripts/verify-settings.sh

      - name: 'verify-schedules.sh — scheduled jobs'
        id: s_schedules
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'schedules')) }}
        run: ./scripts/verify-schedules.sh

      - name: 'verify-notifications.sh — channels (real SMTP through Mailpit)'
        id: s_notifications
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'notifications')) }}
        run: ./scripts/verify-notifications.sh

      # The longest of the nine (~2 min 24 measured): it waits for real probe
      # cycles. Placed last so that the other eight have already given their
      # verdict when it starts.
      - name: 'verify-monitors.sh — supervision de sites'
        id: s_monitors
        if: ${{ !cancelled() && steps.stack.outcome == 'success' && (inputs.only == '' || contains(inputs.only, 'monitors')) }}
        run: ./scripts/verify-monitors.sh

      # ─────────────────────────────────────────────────────────────────────
      - name: Stack logs (on failure)
        if: ${{ failure() }}
        run: |
          for service in panel worker postgres redis; do
            echo "::group::logs $service"
            docker compose logs --tail 200 "$service" 2>&1 || true
            echo '::endgroup::'
          done

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### End-to-end scripts'
            echo
            echo '| Script | Verdict |'
            echo '| --- | --- |'
            echo "| verify-rbac-audit.sh | ${{ steps.s_rbac_audit.outcome }} |"
            echo "| verify-onboarding.sh | ${{ steps.s_onboarding.outcome }} |"
            echo "| verify-roles.sh | ${{ steps.s_roles.outcome }} |"
            echo "| verify-api-tokens.sh | ${{ steps.s_api_tokens.outcome }} |"
            echo "| verify-account.sh | ${{ steps.s_account.outcome }} |"
            echo "| verify-2fa-reset.sh | ${{ steps.s_2fa.outcome }} |"
            echo "| verify-settings.sh | ${{ steps.s_settings.outcome }} |"
            echo "| verify-schedules.sh | ${{ steps.s_schedules.outcome }} |"
            echo "| verify-notifications.sh | ${{ steps.s_notifications.outcome }} |"
            echo "| verify-monitors.sh | ${{ steps.s_monitors.outcome }} |"
            echo
            echo '17 other verify-*.sh stay outside CI: see the header of .github/workflows/e2e.yml'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Take the stack down
        if: ${{ always() }}
        run: |
          docker compose --profile test down -v --remove-orphans || true
          rm -f .env
