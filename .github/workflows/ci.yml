name: CI

# The base: everything that can be checked WITHOUT any service — neither
# Postgres, nor Redis, nor SSH target. Measured at ~23 s of compute on a dev
# workstation (M-series), that is around two minutes on a GitHub runner,
# installation included.
#
# The 26 `scripts/verify-*.sh` are not here: they require the full stack, and
# half of them a privileged docker-in-docker target. They are in `e2e.yml`, on
# manual trigger only. The detail of the reasoning is in `.github/ci-local.md`.

on:
  # Each push, on any branch.
  push:
  # Pushes to a branch of THIS repository are already covered above; the jobs
  # dedupe through the `if:` they carry. The event stays declared for PRs coming
  # from a fork, whose `push` never reaches this repository.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The pnpm version is NOT written here: `pnpm/action-setup` reads it from the
  # root package.json's `packageManager` field (today pnpm@10.32.1). A single
  # source of truth.
  #
  # Node, for its part, is set here and must follow the Dockerfile's
  # NODE_VERSION ARG (`24-alpine`) and the `engines.node` field (`>=24`).
  NODE_VERSION: "24"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Two guards that only cost a checkout: no dependency, no build. They run in
  # parallel with the base so that their verdict arrives fast.
  # ═══════════════════════════════════════════════════════════════════════════
  guards:
    name: Guards
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The migrations check compares with the base: it needs the history,
          # not only the last commit.
          fetch-depth: 0

      # ─────────────────────────────────────────────────────────────────────
      # Guard 1 — no secret enters the repository.
      #
      # Written by hand, without a dependency: four precise checks are worth
      # more than a generic detector of which one does not know what it looks at.
      # ─────────────────────────────────────────────────────────────────────
      - name: 'Guard: no secret in the repository'
        id: secrets
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          ko() { printf '::error title=Secret in the repository::%s\n' "$1"; printf '  FAILURE %s\n' "$1"; failed=1; }
          ok() { printf '  ok      %s\n' "$1"; }

          echo "── 1. Files that must never be tracked by git"
          tracked=$(git ls-files \
            | grep -E '(^|/)\.env($|\.)|(^|/)\.test-target-key' \
            | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            while IFS= read -r f; do
              [ -n "$f" ] && ko "\"$f\" is tracked by git — it must stay ignored"
            done <<< "$tracked"
          else
            ok "neither .env nor .test-target-key* in the index"
          fi

          echo "── 2. .gitignore still covers these files"
          for pattern in '.env' '.test-target-key' '.test-target-key.pub'; do
            if grep -qxF -- "$pattern" .gitignore 2>/dev/null; then
              ok ".gitignore contains \"$pattern\""
            else
              ko "\"$pattern\" disappeared from .gitignore — the original protection is gone"
            fi
          done

          echo "── 3. No real value of MASTER_KEY nor of BETTER_AUTH_SECRET"
          # We do not know the real values and above all do not want to write
          # them here: so we recognize their SHAPE. A secret of this repository
          # is at least 32 characters drawn from the hex/base64 alphabet only
          # (`MASTER_KEY` = 32 bytes in hex, `BETTER_AUTH_SECRET` ≥ 32).
          #
          # This criterion silently lets through everything that is not a
          # secret: `z.string().min(32)` (parentheses and dots outside the
          # alphabet), `key;` (too short), `${MASTER_KEY}` (reference). What
          # remains to rule out are the templates that do have the expected
          # shape — hence the short list below, kept close to the .env.example.
          suspicious() { # 0 = suspicious, 1 = harmless
            value="$1"
            case "$value" in
              ''|'""'|"''")                                       return 1 ;;
              \$*)                                                return 1 ;;
              *change-me*|*changeme*|*CHANGE_ME*)                 return 1 ;;
              *votre*|*your*|*'<'*|*'…'*|*TODO*|*example*)        return 1 ;;
            esac
            # A run of one and the same character (000…0, xxx…x) is a template.
            case "$value" in
              *[!0]*) ;; *) return 1 ;;
            esac
            case "$value" in
              *[!x]*) ;; *) return 1 ;;
            esac
            # Shape of a secret: ≥ 32 characters, hex/base64 alphabet only.
            printf '%s' "$value" | grep -qE '^[A-Za-z0-9+/=_-]{32,}$'
          }
          lines=$(git grep -nIE '(MASTER_KEY|BETTER_AUTH_SECRET)[[:space:]]*[:=]' \
                     -- . ':(exclude)pnpm-lock.yaml' || true)
          if [ -z "$lines" ]; then
            ok "no assignment found"
          else
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              file=${line%%:*}; rest=${line#*:}
              number=${rest%%:*};  text=${rest#*:}
              value=$(printf '%s' "$text" \
                | sed -E 's/^.*(MASTER_KEY|BETTER_AUTH_SECRET)[[:space:]]*[:=][[:space:]]*//' \
                | tr -d '\r' \
                | sed -E "s/^['\"]//; s/['\"].*$//" \
                | awk '{print $1}')
              if suspicious "$value"; then
                ko "$file:$number — likely real value for this secret"
              else
                ok "$file:$number — not the shape of a secret"
              fi
            done <<< "$lines"
          fi

          echo "── 4. No API key in clear"
          # Patterns modeled on each provider's REAL shape: an OpenRouter key is
          # "sk-or-v1-" followed by lowercase hexadecimal. verify-settings.sh's
          # uppercase sentinel does not have that shape, and that is just fine —
          # it is there to be visible, not secret.
          patterns='sk-or-v1-[0-9a-f]{32,}'
          patterns="$patterns"'|sk-ant-[A-Za-z0-9_-]{40,}'
          patterns="$patterns"'|sk-proj-[A-Za-z0-9_-]{40,}'
          patterns="$patterns"'|gh[pousr]_[A-Za-z0-9]{30,}'
          patterns="$patterns"'|AKIA[0-9A-Z]{16}'
          # Pupitre's API tokens: `pup_` and 43 base64url characters.
          patterns="$patterns"'|pup_[A-Za-z0-9_-]{43}'
          found=$(git grep -nIE "$patterns" -- . ':(exclude)pnpm-lock.yaml' || true)
          if [ -n "$found" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              ko "apparent API key: ${line%%:*}:$(printf '%s' "${line#*:}" | cut -d: -f1)"
            done <<< "$found"
          else
            ok "no API key shape"
          fi

          echo "── 5. No complete private key"
          # The PEM header alone proves nothing: the add target screen and its
          # help show it as an example of what the user must paste. What gives a
          # real key away is the BODY — long lines of base64. So we require both
          # in the same file.
          headers=$(git grep -lE '^-{5}BEGIN [A-Z ]*PRIVATE KEY-{5}' \
                      -- . ':(exclude)pnpm-lock.yaml' || true)
          if [ -z "$headers" ]; then
            ok "no private key header"
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              if grep -qE '^[A-Za-z0-9+/]{60,}={0,2}$' "$f"; then
                ko "\"$f\" carries a complete private key (header AND base64 body)"
              else
                ok "\"$f\" only quotes the PEM header as an example, without a body"
              fi
            done <<< "$headers"
          fi

          echo
          if [ "$failed" -ne 0 ]; then
            echo "A secret is not removed from a repository by deleting it at the next commit:"
            echo "the history keeps it. Rewrite the branch, then revoke the value."
            exit 1
          fi
          echo "No secret in the repository."

      # ─────────────────────────────────────────────────────────────────────
      # Guard 2 — migrations are immutable.
      #
      # CLAUDE.md: "never edit an applied migration, always create a new one".
      # A migration already applied in the database of a deployment will never
      # be replayed: changing it changes nothing there and everything elsewhere.
      # Adding a file stays permitted, of course.
      # ─────────────────────────────────────────────────────────────────────
      - name: 'Guard: immutable migrations'
        id: migrations
        if: ${{ !cancelled() }}
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          MIGRATIONS='packages/db/migrations/*.sql'

          # The reference is ALWAYS "what is already on the default branch".
          # Comparing with the previous push would be wrong on a work branch: a
          # migration added then touched up before the merge was never applied
          # anywhere, touching it up is legitimate. Single exception, the push ON
          # the reference branch itself: there, the base is indeed the state
          # from before the push.
          ref_branch="${DEFAULT_BRANCH:-main}"
          [ "${GITHUB_EVENT_NAME}" = 'pull_request' ] && ref_branch="${GITHUB_BASE_REF:-$ref_branch}"
          git fetch --no-tags --quiet origin \
            "+refs/heads/${ref_branch}:refs/remotes/origin/${ref_branch}" 2>/dev/null || true

          base=''
          if [ "${GITHUB_EVENT_NAME}" = 'push' ] && [ "${GITHUB_REF:-}" = "refs/heads/${ref_branch}" ]; then
            if [ -n "${BEFORE:-}" ] \
               && [ "${BEFORE}" != '0000000000000000000000000000000000000000' ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="${BEFORE}"
            else
              base=$(git rev-parse --verify --quiet 'HEAD^' || true)
            fi
          else
            base=$(git merge-base "origin/${ref_branch}" HEAD 2>/dev/null || true)
          fi

          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then
            echo "No usable comparison base (new branch, or first commit)."
            echo "Nothing to compare — check not applicable."
            exit 0
          fi
          echo "Comparison base: $base"
          echo

          # A = addition, allowed. M = modification, D = deletion, R = rename:
          # all three forbidden on a file already present on the base. The glob
          # stays BETWEEN QUOTES: it is git that must interpret it. Expanded by
          # the shell, it would only list the files present in the working copy
          # — and a DELETED migration would escape it.
          touched=$(git diff --name-status --diff-filter=MDR "$base" HEAD -- "$MIGRATIONS" || true)
          if [ -z "$touched" ]; then
            added=$(git diff --name-only --diff-filter=A "$base" HEAD -- "$MIGRATIONS" || true)
            if [ -n "$added" ]; then
              echo "Migrations added (it is the right way to do it):"
              while IFS= read -r f; do [ -n "$f" ] && printf '  + %s\n' "$f"; done <<< "$added"
            else
              echo "No migration touched."
            fi
            echo
            echo "The migrations already present are intact."
            exit 0
          fi

          echo "$touched" | while IFS=$'\t' read -r state file _; do
            case "$state" in
              M*) verb='modified' ;;
              D*) verb='deleted' ;;
              R*) verb='renamed' ;;
              *)  verb="touched ($state)" ;;
            esac
            printf '::error file=%s,title=Migration modified::%s was %s\n' \
              "$file" "$file" "$verb"
            printf '  FAILURE %s was %s\n' "$file" "$verb"
          done
          echo
          echo "A migration already on the base was touched."
          echo "The instances where it ran will never replay it: their schema"
          echo "and the file would diverge silently."
          echo "Restore the file, then \"pnpm db:generate\" for a NEW migration."
          exit 1

      - name: Guards summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### Guards'
            echo
            echo '| Guard | Verdict |'
            echo '| --- | --- |'
            echo "| No secret in the repository | ${{ steps.secrets.outcome }} |"
            echo "| Immutable migrations | ${{ steps.migrations.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ═══════════════════════════════════════════════════════════════════════════
  # The base. One job, named steps: the red line designates the faulty check.
  # The six checks are independent, so they all run even if one of them
  # falls — a single CI pass is enough to see the full extent of the damage,
  # instead of discovering them one by one.
  # ═══════════════════════════════════════════════════════════════════════════
  base:
    name: Base
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Dependencies
        run: pnpm install --frozen-lockfile

      # ─────────────────────────────────────────────────────────────────────
      # THIS STEP MUST PRECEDE ALL THE TYPE CHECKS.
      #
      # @pupitre/core and @pupitre/db are consumed through their `dist`: their
      # package.json point `exports` to `./dist/*.js` and `./dist/*.d.ts`, never
      # to `src`. On a fresh copy, `dist/` does not exist, and `pnpm -r
      # typecheck` fails immediately on ~35 "Cannot find module
      # '@pupitre/core'" in @pupitre/db — symbols that do exist in the sources.
      #
      # `pnpm -r` follows the topological order, but that is not enough:
      # @pupitre/core's `typecheck` runs with `--noEmit`, so it does not produce
      # the `dist` @pupitre/db needs. A real build is required.
      #
      # Measured on a fresh copy, not assumed.
      # ─────────────────────────────────────────────────────────────────────
      - name: 'Build @pupitre/core and @pupitre/db (typecheck prerequisites)'
        id: build
        run: pnpm build:packages

      - name: 'Types: all packages'
        id: types
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm -r typecheck

      - name: 'Types: scripts/'
        id: types_scripts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec tsc --noEmit -p scripts/tsconfig.json

      - name: 'Lint: @pupitre/web'
        id: lint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @pupitre/web lint

      - name: 'Unit tests: @pupitre/core'
        id: tests_core
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --filter @pupitre/core test

      - name: 'Tests: periodicity and cron'
        id: tests_schedule
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:schedule

      - name: "Tests: AI catalog (offline, without a key)"
        id: tests_ai
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm test:ai

      - name: Base summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### Socle'
            echo
            echo '| Check | Verdict |'
            echo '| --- | --- |'
            echo "| Construction @pupitre/core + @pupitre/db | ${{ steps.build.outcome }} |"
            echo "| Types (all packages) | ${{ steps.types.outcome }} |"
            echo "| Types (scripts/) | ${{ steps.types_scripts.outcome }} |"
            echo "| Lint @pupitre/web | ${{ steps.lint.outcome }} |"
            echo "| @pupitre/core unit tests | ${{ steps.tests_core.outcome }} |"
            echo "| Periodicity/cron tests | ${{ steps.tests_schedule.outcome }} |"
            echo "| AI catalog tests | ${{ steps.tests_ai.outcome }} |"
            echo
            echo 'Reproduce locally: see .github/ci-local.md'
          } >> "$GITHUB_STEP_SUMMARY"
