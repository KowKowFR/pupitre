name: Proposition d'évolution
description: Une capacité qui manque, ou une manière de faire à changer.
labels: ['évolution']
body:
  - type: markdown
    attributes:
      value: |
        Trois choses à savoir avant d'écrire, elles décident souvent de la
        réponse :

        - **`CLAUDE.md` porte des décisions figées** (pas de registry, pas
          d'Ansible, pas de cron Linux, build sur la machine cible). Une
          proposition qui en rouvre une doit d'abord dire pourquoi la décision
          était mauvaise ;
        - **`docs/feuille-de-route.md`** liste ce qui manque déjà, avec l'endroit
          du code concerné. Votre idée y est peut-être ;
        - le critère de qualité du projet est qu'**ajouter un runtime, un proxy
          ou un scanner se fasse en ajoutant une classe**, sans modifier une
          ligne ailleurs. Les propositions qui respectent cette forme avancent
          vite ; les autres, non.

  - type: textarea
    id: probleme
    attributes:
      label: Le problème
      description: >-
        Décrivez la situation vécue, pas la solution. « Je ne peux pas X parce
        que Y », plutôt que « il faudrait ajouter un bouton Z ».
    validations:
      required: true

  - type: textarea
    id: proposition
    attributes:
      label: Ce que vous proposez
      description: >-
        Si vous voyez où ça vit dans le code — un driver, une interface, une
        table, une route — dites-le.
    validations:
      required: true

  - type: dropdown
    id: abstraction
    attributes:
      label: Est-ce une nouvelle implémentation d'une abstraction existante ?
      description: >-
        Un nouveau runtime, un nouveau proxy, un nouveau scanner, un nouveau
        type de sonde ou un nouveau canal de notification se branche sur une
        interface qui existe déjà.
      options:
        - 'Non'
        - 'Oui — un DeploymentDriver'
        - 'Oui — un ProxyProvider'
        - 'Oui — un Scanner'
        - 'Oui — un type de sonde'
        - 'Oui — un canal de notification'
        - Je ne sais pas
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Ce que vous avez envisagé d'autre
      description: >-
        Y compris les contournements qui marchent aujourd'hui. Un contournement
        acceptable est une raison légitime de ne rien faire.

  - type: textarea
    id: verification
    attributes:
      label: Comment on saurait que c'est fait
      description: >-
        Le projet vérifie ses capacités par des scripts qui empruntent les mêmes
        routes que l'interface. À quoi ressemblerait celui-ci ? Que devrait-il
        prouver, et sur quelle infrastructure ?
      placeholder: >-
        Un scanner de plus, coché seul dans la politique, donne le même verdict
        de blocage que Trivy sur la même image volontairement vulnérable, et la
        comparaison se fait CVE par CVE.

  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: J'ai lu `docs/feuille-de-route.md` et ma proposition n'y figure pas déjà.
          required: true
        - label: >-
            Si ma proposition rouvre une décision figée de `CLAUDE.md`, je l'ai
            dit explicitement ci-dessus.
          required: true
