name: Rapport de bogue
description: Quelque chose ne se comporte pas comme la documentation le dit.
labels: ['bogue']
body:
  - type: markdown
    attributes:
      value: |
        Merci. Deux vérifications avant de continuer, elles font gagner du temps
        aux deux côtés :

        - la section **« Limites connues »** du README liste ce qui ne marche
          déjà pas, avec les mesures. Votre problème y est peut-être décrit ;
        - une **faille de sécurité** ne se signale pas ici. Voir `SECURITY.md`.

  - type: textarea
    id: attendu-observe
    attributes:
      label: Ce que vous attendiez, et ce que vous avez obtenu
      description: >-
        Si la documentation dit autre chose que ce que fait le code, citez le
        passage — c'est peut-être la documentation qui a tort.
      placeholder: |
        Attendu : le déploiement s'arrête à l'étape « scan » avec failOn: HIGH.
        Obtenu : l'étape passe en success, et le déploiement continue.
    validations:
      required: true

  - type: textarea
    id: reproduire
    attributes:
      label: Comment le reproduire
      description: >-
        Numérotez les étapes. Une commande `curl`, une AppSpec minimale ou un
        script valent mieux qu'une description.
      placeholder: |
        1. cp .env.example .env && docker compose up -d --build
        2. ./scripts/setup-test-target.sh
        3. créer une application depuis la spec ci-dessous
        4. déployer avec failOn: HIGH
    validations:
      required: true

  - type: textarea
    id: appspec
    attributes:
      label: AppSpec concernée, si le problème touche un déploiement
      description: >-
        Réduisez-la au minimum qui reproduit. **Retirez toute valeur de secret.**
      render: json

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime de la cible
      options:
        - Docker Compose
        - K3s
        - les deux
        - sans objet
    validations:
      required: true

  - type: dropdown
    id: zone
    attributes:
      label: Zone concernée
      multiple: true
      options:
        - Panel (apps/web)
        - Worker (apps/worker)
        - Driver Docker
        - Driver K3s
        - AppSpec et rendu
        - Scanners (Trivy / Grype / Syft)
        - Secrets et chiffrement
        - RBAC, comptes, TOTP
        - Supervision de sites ou de serveurs
        - Notifications
        - Tâches planifiées
        - Génération par IA
        - Documentation
        - Je ne sais pas

  - type: textarea
    id: logs
    attributes:
      label: Journaux
      description: >-
        `docker compose logs --tail=200 panel worker`, ou l'export des logs du
        déploiement. **Relisez avant de coller** : pas de clé, pas de mot de
        passe, pas d'adresse IP que vous ne voulez pas publier.
      render: text

  - type: input
    id: version
    attributes:
      label: Commit
      description: 'Sortie de `git rev-parse --short HEAD`. Il n''existe pas de version publiée.'
      placeholder: 94a3dd2
    validations:
      required: true

  - type: textarea
    id: environnement
    attributes:
      label: Environnement
      description: >-
        Système du panel, système de la cible, versions de Docker ou de k3s côté
        cible. `curl -s http://localhost:3000/api/health` est utile aussi.
      placeholder: |
        Panel   : macOS 15, Docker Desktop 4.x
        Cible   : Debian 12, Docker 27.3
        health  : {"status":"ok","db":"ok","redis":"ok"}
    validations:
      required: true

  - type: checkboxes
    id: verifications
    attributes:
      label: Vérifications
      options:
        - label: J'ai lu la section « Limites connues » du README et mon problème n'y est pas décrit.
          required: true
        - label: Ce rapport ne contient ni clé, ni mot de passe, ni valeur de secret.
          required: true
